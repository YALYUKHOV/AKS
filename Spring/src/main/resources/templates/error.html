<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="container container--narrow">
    <div class="error-page">
        <div class="error-page__code" th:text="${status}">500</div>
        <p th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Что-то пошло не так'">Что-то пошло не так</p>
        <a th:href="@{/}" class="btn btn--primary">На главную</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
