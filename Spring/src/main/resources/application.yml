server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: aks-spring
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aks_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: debug
